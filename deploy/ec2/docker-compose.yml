# Vexa Lite on one EC2 box: Postgres + MinIO + Lite + Caddy (TLS).
# Gateway is the only public surface (443). Terminal and agent-api stay inside the container.
#
# Usage (from this directory, after .env is filled):
#   docker compose pull && docker compose up -d --force-recreate

name: vexa-ec2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - vexa-pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - vexa-miniodata:/data
    command: ["server", "/data", "--console-address", ":9001"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set vexa http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1)); [ "$$i" -gt 30 ] && exit 1
          sleep 2
        done
        mc mb --ignore-existing vexa/vexa
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

  vexa:
    image: ${VEXA_IMAGE:-cofoundercircle/vexa-lite:test}
    restart: unless-stopped
    shm_size: "2gb"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_API_TOKEN: ${ADMIN_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: vexa
      MINIO_SECURE: "false"
      VEXA_PUBLIC_API_URL: ${VEXA_PUBLIC_API_URL}
      TERMINAL_PUBLIC_URL: ${VEXA_PUBLIC_API_URL}
      TRANSCRIPTION_SERVICE_URL: ${TRANSCRIPTION_SERVICE_URL}
      TRANSCRIPTION_SERVICE_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL}
    ports:
      - "127.0.0.1:8056:8056"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8056/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      vexa:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      VEXA_DOMAIN: ${VEXA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  vexa-pgdata:
  vexa-miniodata:
  caddy-data:
  caddy-config:
